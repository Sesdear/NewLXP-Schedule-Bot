<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>IT Hub LXP - Профиль</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="../static/style.css">
</head>
<body class="app-body">
    <div class="screen-container">

        <div class="profile-header">
            <div class="user-info">
                <div class="avatar">
                    <img src="/static/avatar-placeholder.png" alt="Avatar" id="userAvatar">
                </div>
                <div class="user-details">
                    <h1 id="userName">Егор Членов</h1>
                    <span class="group-name" id="userGroup">(Название группы)</span>
                </div>
            </div>
            <button class="icon-btn primary-circle">+</button>
        </div>

        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-value">120 XP</div>
                <div class="stat-label">ОПЫТ ОБУЧЕНИЯ</div>
            </div>
            <div class="stat-card">
                <div class="stat-value accent">Level 4</div>
                <div class="stat-label">ТЕКУЩИЙ УРОВЕНЬ</div>
            </div>
        </div>

        <div class="section-header">
            <h2>Расписание сегодня</h2>
            <a href="#" class="section-link">Все предметы</a>
        </div>

        <div class="schedule-list">
            <!-- Item 1 -->
            <div class="schedule-card">
                <div class="card-title-row">
                    <h3>Английский язык, уровень B1+</h3>
                    <button class="info-btn">i</button>
                </div>
                <div class="card-meta">
                    <div class="meta-item">
                        <span class="icon">👤</span>
                        <span>Шайнурова Гульфира Ильхамовна</span>
                    </div>
                    <div class="meta-row">
                        <div class="meta-item">
                            <span class="icon">📍</span>
                            <span>Кабинет 2-415</span>
                        </div>
                        <div class="meta-item">
                            <span class="icon">🕒</span>
                            <span>16:50 - 18:20</span>
                        </div>
                    </div>
                </div>
            </div>

            <div class="schedule-card">
                <div class="card-title-row">
                    <h3>ООП на C#</h3>
                    <button class="info-btn">i</button>
                </div>
                <div class="card-meta">
                    <div class="meta-item">
                        <span class="icon">👤</span>
                        <span>Юферов Денис Юрьевич</span>
                    </div>
                    <div class="meta-row">
                        <div class="meta-item">
                            <span class="icon">📍</span>
                            <span>Кабинет 2-407</span>
                        </div>
                        <div class="meta-item">
                            <span class="icon">🕒</span>
                            <span>18:30 - 20:00</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <nav class="bottom-nav">
        <a href="../templates/profile.html" class="nav-item active">
            <span class="nav-icon">👤</span>
            <span>ПРОФИЛЬ</span>
        </a>
        <a href="../templates/feedback.html" class="nav-item">
            <span class="nav-icon">💬</span>
            <span>ОТЗЫВЫ</span>
        </a>
    </nav>
</body>
</html>
